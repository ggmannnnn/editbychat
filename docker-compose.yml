services:
  editor:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PROJECTS_DIR: /app/projects
      PORT: 8000
    volumes:
      - ./projects:/app/projects
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
